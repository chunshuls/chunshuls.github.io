<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>moyu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0e11'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%234fd1c5' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0c0e11;
    --panel:#12151a;
    --line:#20252d;
    --ink:#c9cfd8;
    --dim:#6b7480;
    --hi:#4fd1c5;
    --warn:#d9a04f;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
    --sans:"HarmonyOS Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{min-height:100vh;-webkit-font-smoothing:antialiased}

  header{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
    padding:0 14px;height:36px;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;
    background:rgba(12,14,17,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto;
  }
  header::-webkit-scrollbar{display:none}
  .brand{color:var(--ink);font-weight:700;letter-spacing:.22em;text-transform:uppercase}
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:3px;
    border:1px solid var(--line);color:var(--dim);
  }
  .pill b{font-weight:600}
  .pill.live{color:var(--hi);border-color:rgba(79,209,197,.38)}
  .pill.local{color:var(--warn);border-color:rgba(217,160,79,.35)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.live .dot{box-shadow:0 0 0 3px rgba(79,209,197,.14)}
  .kv{color:var(--dim)}
  .kv b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .spacer{flex:1}
  #note{color:var(--dim);overflow:hidden;text-overflow:ellipsis;max-width:46vw}

  #grid{columns:4;column-gap:12px;padding:12px;max-width:2200px;margin:0 auto}
  @media(max-width:1500px){#grid{columns:3}}
  @media(max-width:1000px){#grid{columns:2}}
  @media(max-width:620px){#grid{columns:1;padding:8px;column-gap:8px}}

  .card{
    display:block;margin:0 0 12px;break-inside:avoid;border-radius:5px;overflow:hidden;
    background:var(--panel);border:1px solid var(--line);cursor:zoom-in;
    transition:border-color .2s ease;
  }
  .card:hover{border-color:#333c47}
  .card img{
    display:block;width:100%;height:auto;opacity:0;transform:translateY(6px);
    transition:opacity .5s ease,transform .5s ease;
  }
  .card img.in{opacity:1;transform:none}
  @media(max-width:620px){.card{margin-bottom:8px}}

  #empty{padding:14px;color:var(--dim);font-family:var(--mono);font-size:12px}

  #box{
    position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(6,7,9,.94);backdrop-filter:blur(6px);
  }
  #box.on{display:flex}
  #box img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:4px}
  #boxnav{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.08em;
    background:rgba(18,21,26,.8);border:1px solid var(--line);border-radius:3px;padding:5px 12px;
  }
  .hit{position:absolute;top:0;bottom:0;width:34%;cursor:pointer}
  .hit.l{left:0}.hit.r{right:0}
  #boxclose{
    position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:12px;
    color:var(--dim);background:none;border:1px solid var(--line);border-radius:3px;
    padding:4px 10px;cursor:pointer;
  }
  #boxclose:hover{color:var(--ink)}
</style>
</head>
<body>
<header>
  <span class="brand">moyu</span>
  <span id="link" class="pill"><span class="dot"></span><b>BOOT</b></span>
  <span class="kv">pool <b id="pool">--</b></span>
  <span class="kv">batch <b id="batchNo">--</b></span>
  <span class="kv">next <b id="next">--:--</b></span>
  <span class="kv">viewers <b id="viewers">--</b></span>
  <span class="spacer"></span>
  <span id="note"></span>
</header>

<main id="grid"></main>
<div id="empty" hidden></div>

<div id="box">
  <button id="boxclose">ESC</button>
  <div class="hit l" data-step="-1"></div>
  <img id="boximg" alt="">
  <div class="hit r" data-step="1"></div>
  <div id="boxnav">-- / --</div>
</div>

<script>
(function () {
  "use strict";

  var BATCH_SIZE = 20;
  var PING_MS = 45000;            // heartbeat cadence while the page is open
  var LOCAL_REFRESH_MS = 600000;  // offline fallback: rotate every 10 min
  var CID_KEY = "moyu.cid";
  var FB_KEY = "moyu.fallback";

  var el = {
    link: document.getElementById("link"),
    pool: document.getElementById("pool"),
    batchNo: document.getElementById("batchNo"),
    next: document.getElementById("next"),
    viewers: document.getElementById("viewers"),
    note: document.getElementById("note"),
    grid: document.getElementById("grid"),
    empty: document.getElementById("empty"),
    box: document.getElementById("box"),
    boximg: document.getElementById("boximg"),
    boxnav: document.getElementById("boxnav")
  };

  var S = {
    manifest: null,
    backend: null,
    live: false,
    batch: [],
    refreshCount: 0,
    countdown: 0,
    ticker: null,
    boxIdx: 0
  };

  function cid() {
    var v = null;
    try { v = localStorage.getItem(CID_KEY); } catch (e) {}
    if (!v) {
      v = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      try { localStorage.setItem(CID_KEY, v); } catch (e) {}
    }
    return v;
  }

  function readStore(key) {
    try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; }
  }

  function writeStore(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  function fetchJSON(url, opts, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms || 9000);
    var o = opts || {};
    o.signal = ctrl.signal;
    o.cache = "no-store";
    return fetch(url, o).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).finally(function () { clearTimeout(timer); });
  }

  function sample(arr, n) {
    var copy = arr.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = copy[i]; copy[i] = copy[j]; copy[j] = t;
    }
    return copy.slice(0, n);
  }

  function setLink(mode, label) {
    el.link.className = "pill " + mode;
    el.link.innerHTML = '<span class="dot"></span><b>' + label + "</b>";
    S.live = mode === "live";
  }

  function fmt(sec) {
    if (sec < 0) sec = 0;
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function render() {
    var grid = el.grid;
    grid.innerHTML = "";
    if (!S.batch.length) {
      el.empty.hidden = false;
      el.empty.textContent = "no pool yet -- waiting for manifest.json";
      return;
    }
    el.empty.hidden = true;

    var frag = document.createDocumentFragment();
    S.batch.forEach(function (name, i) {
      var a = document.createElement("a");
      a.className = "card";
      a.href = "img/" + name;
      a.setAttribute("data-i", i);

      var img = document.createElement("img");
      img.loading = i < 6 ? "eager" : "lazy";
      img.decoding = "async";
      img.alt = "";
      img.addEventListener("load", function () { img.classList.add("in"); });
      img.addEventListener("error", function () { a.remove(); });
      img.src = "img/" + name;

      a.appendChild(img);
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        openBox(i);
      });
      frag.appendChild(a);
    });
    grid.appendChild(frag);
  }

  function setBatch(files) {
    if (!files || !files.length) return;
    var same = files.length === S.batch.length && files.every(function (f, i) { return f === S.batch[i]; });
    if (same) return;
    S.batch = files;
    render();
  }

  function applyState(st) {
    if (typeof st.refresh_count === "number") {
      S.refreshCount = st.refresh_count;
      el.batchNo.textContent = String(st.refresh_count);
    }
    if (typeof st.pool_size === "number") el.pool.textContent = String(st.pool_size);
    if (typeof st.online === "number") el.viewers.textContent = String(st.online);
    if (typeof st.next_refresh_in === "number") S.countdown = st.next_refresh_in;
    if (st.batch && st.batch.length) setBatch(st.batch);

    if (st.pool_source && st.pool_source !== "github-pages") {
      el.note.textContent = "pool:" + st.pool_source;
    } else {
      el.note.textContent = "";
    }
  }

  function useFallback() {
    setLink("local", "LOCAL");
    el.viewers.textContent = "--";
    var pool = (S.manifest && S.manifest.images ? S.manifest.images.map(function (x) { return x.f; }) : []);
    if (!pool.length) return;

    var saved = readStore(FB_KEY);
    var now = Date.now();
    if (saved && saved.files && (now - saved.at) < LOCAL_REFRESH_MS) {
      setBatch(saved.files);
      S.countdown = Math.round((LOCAL_REFRESH_MS - (now - saved.at)) / 1000);
      return;
    }
    var files = sample(pool, Math.min(BATCH_SIZE, pool.length));
    writeStore(FB_KEY, { at: now, files: files });
    setBatch(files);
    S.countdown = Math.round(LOCAL_REFRESH_MS / 1000);
    S.refreshCount += 1;
    el.batchNo.textContent = String(S.refreshCount);
  }

  function ping() {
    if (!S.backend || !S.backend.url) { useFallback(); return Promise.resolve(); }
    return fetchJSON(S.backend.url.replace(/\/+$/, "") + "/api/ping", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cid: cid() })
    }, 10000).then(function (st) {
      setLink("live", "LINKED");
      applyState(st);
    }).catch(function () {
      useFallback();
    });
  }

  function startTicker() {
    if (S.ticker) return;
    S.ticker = setInterval(function () {
      if (document.hidden) return;
      S.countdown -= 1;
      el.next.textContent = fmt(S.countdown);
      if (S.countdown <= 0) {
        if (S.live) { ping(); }
        else { useFallback(); }
      }
    }, 1000);
  }

  function openBox(i) {
    S.boxIdx = i;
    el.box.classList.add("on");
    paintBox();
  }

  function paintBox() {
    if (!S.batch.length) return;
    el.boximg.src = "img/" + S.batch[S.boxIdx];
    el.boxnav.textContent = (S.boxIdx + 1) + " / " + S.batch.length;
  }

  function stepBox(d) {
    if (!S.batch.length) return;
    S.boxIdx = (S.boxIdx + d + S.batch.length) % S.batch.length;
    paintBox();
  }

  function closeBox() { el.box.classList.remove("on"); }

  function bind() {
    document.getElementById("boxclose").addEventListener("click", closeBox);
    Array.prototype.forEach.call(document.querySelectorAll(".hit"), function (h) {
      h.addEventListener("click", function () { stepBox(parseInt(h.getAttribute("data-step"), 10)); });
    });
    el.box.addEventListener("click", function (ev) { if (ev.target === el.box) closeBox(); });
    document.addEventListener("keydown", function (ev) {
      if (!el.box.classList.contains("on")) return;
      if (ev.key === "Escape") closeBox();
      else if (ev.key === "ArrowLeft") stepBox(-1);
      else if (ev.key === "ArrowRight") stepBox(1);
    });
  }

  function boot() {
    bind();
    fetchJSON("manifest.json", null, 12000).then(function (m) {
      S.manifest = m;
      if (m && typeof m.count === "number") el.pool.textContent = String(m.count);

      return fetchJSON("backend.json", null, 8000)
        .then(function (b) { S.backend = b; })
        .catch(function () { S.backend = null; });

    }).then(function () {
      return ping();
    }).then(function () {
      // state fetched (or fallback applied) -- keep the heartbeat going
      if (!S.batch.length) useFallback();
      startTicker();
      setInterval(function () { if (!document.hidden) ping(); }, PING_MS);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) ping();
      });
    }).catch(function () {
      setLink("local", "OFFLINE");
      el.empty.hidden = false;
      el.empty.textContent = "manifest.json unavailable";
    });
  }

  boot();
})();
</script>
</body>
</html>
