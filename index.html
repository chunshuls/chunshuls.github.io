<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chunshuls.github.io</title>
<style>
  :root{--ink:#16130f;--paper:#f7f3ec;--line:#ddd4c6;--accent:#8c2f2f;--mute:#6d6459}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:40px 24px;background:var(--paper);color:var(--ink);
       font-family:"Yu Mincho","Source Han Serif SC","Noto Serif CJK SC",Georgia,serif}
  main{width:100%;max-width:620px}
  h1{font-size:30px;letter-spacing:.08em;margin:0 0 6px;font-weight:600}
  .sub{font-size:13px;color:var(--mute);letter-spacing:.14em;margin-bottom:30px}
  .rule{height:1px;background:var(--line);margin:26px 0}
  p{font-size:15px;line-height:1.95;margin:0 0 14px}
  .ok{display:inline-block;font-size:12px;letter-spacing:.1em;color:var(--accent);
      border:1px solid var(--accent);padding:3px 10px;margin-bottom:22px}
  footer{font-size:12px;color:var(--mute);margin-top:34px;letter-spacing:.06em}
  a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="ok">PAGES ONLINE</div>
  <h1>chunshuls.github.io</h1>
  <div class="sub">GITHUB PAGES · 占位页</div>

  <p>链路已打通：这个页面由 GitHub Pages 从仓库 <code>chunshuls/chunshuls.github.io</code> 发布。</p>
  <p>目前是占位内容，用来验证 认证 → 推送 → 构建 → 公网可访问 这条完整路径。</p>

  <div class="rule"></div>

  <p style="color:var(--mute);font-size:13px">
    下一步可以把 <code>E:\test\pic-collector\result</code> 的图库搬到这里的子目录，
    或直接替换本页内容。
  </p>

  <footer>Built with plain HTML · served by GitHub Pages</footer>
</main>
</body>
</html>
